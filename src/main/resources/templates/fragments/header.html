<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header" class="site-header">

    <a th:href="@{/}"
       class="site-logo"
       aria-label="Blocz - página inicial">

        <img th:src="@{/img/Logo.svg}"
             alt="Logo Blocz">

    </a>

    <nav class="site-nav" aria-label="Navegação principal">

        <a th:href="@{/}">
            INÍCIO
        </a>

        <a th:href="@{/produtos}">
            PRODUTOS
        </a>

        <a th:href="@{/lego}">
            MONTE AVATAR
        </a>

        <a th:href="@{/diversao}">
            DIVERSÃO
        </a>

        <a th:href="@{/carrinho}"
           class="cart-link">

            CARRINHO

            <span id="cart-count"
                  class="cart-badge"
                  aria-hidden="true"></span>

            <span id="cart-count-sr"
                  class="sr-only"
                  aria-live="polite"></span>

        </a>

    </nav>

    <div id="auth-status" class="auth-status">
        <!-- preenchido pelo header.js -->
    </div>

</header>

</body>
</html>
