<div th:fragment="vlibras">

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  (function(){
    var widget = null;
    window.toggleVlibras = function(){
      var btn = document.getElementById('vlibras-btn');
      if (!widget) {
        widget = new window.VLibras.Widget('https://vlibras.gov.br/app');
        btn.setAttribute('aria-expanded', 'true');
        btn.setAttribute('aria-label', 'Desativar intérprete de Libras (VLibras)');
      } else {
        widget.close();
        widget = null;
        btn.setAttribute('aria-expanded', 'false');
        btn.setAttribute('aria-label', 'Ativar intérprete de Libras (VLibras)');
      }
    };
  })();
</script>
</div>
