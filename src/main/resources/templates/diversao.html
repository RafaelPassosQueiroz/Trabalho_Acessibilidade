<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="shortcut icon"
        th:href="@{/img/favicon.ico}"
        type="image/x-icon"
    >

    <script th:src="@{/js/theme.js}"></script>

    <title>blocz — Diversão</title>

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/fun.css}">
</head>

<body>
    <a href="#conteudo-principal" class="skip-link">
        Pular para o conteúdo principal
    </a>

    <div th:replace="~{fragments/header :: header}"></div>

    <main id="conteudo-principal">
        <section class="games-carousel" aria-label="Galeria de imagens">
            <button
                type="button"
                class="carousel-arrow carousel-arrow-left"
                id="prevGame"
                aria-label="Imagem anterior"
            >
                <span aria-hidden="true">‹</span>
            </button>

            <div class="carousel-frame">
                <img
                    id="carouselImage"
                    class="carousel-image"
                    src="/img/ChatGPT%20Image%207%20de%20ago.%20de%202026,%2013_04_49.png"
                    alt="Imagem do carrossel"
                >
            </div>

            <button
                type="button"
                class="carousel-arrow carousel-arrow-right"
                id="nextGame"
                aria-label="Próxima imagem"
            >
                <span aria-hidden="true">›</span>
            </button>

            <div class="carousel-progress" aria-hidden="true">
                <span id="carouselProgress"></span>
            </div>
        </section>

        <section class="game-grid" aria-label="Jogos">
            <a class="game-card featured-game" href="/jogo" aria-label="Blocz Catch">
                <img src="/img/blocz-catch.jpg" alt="Blocz Catch">
            </a>

            <div class="game-card" aria-label="Jogo 2">
                <img src="/img/6d1aaa5b-9d15-4c4e-9d3b-f72663e79a1d.jpg" alt="">
            </div>

            <div class="game-card" aria-label="Jogo 3">
                <img src="/img/6d1aaa5b-9d15-4c4e-9d3b-f72663e79a1d.jpg" alt="">
            </div>

            <div class="game-card" aria-label="Jogo 4">
                <img src="/img/6d1aaa5b-9d15-4c4e-9d3b-f72663e79a1d.jpg" alt="">
            </div>

            <div class="game-card" aria-label="Jogo 5">
                <img src="/img/6d1aaa5b-9d15-4c4e-9d3b-f72663e79a1d.jpg" alt="">
            </div>
        </section>
    </main>

    <script th:src="@{/js/cart.js}"></script>
    <script th:src="@{/js/header.js}"></script>
    <script th:src="@{/js/fun-carousel.js}"></script>
</body>
</html>
