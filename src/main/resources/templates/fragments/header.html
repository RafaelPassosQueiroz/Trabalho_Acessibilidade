<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header" class="site-header">
  <a th:href="@{/}" class="site-logo">
    <img th:src="@{/img/logo.svg}" alt="blocz" class="site-logo-img">
  </a>

  <nav class="site-nav" aria-label="Navegação principal">
    <a th:href="@{/}">Home</a>
    <a th:href="@{/produtos}">Produtos</a>
    <a th:href="@{/avatar}">Montar Avatar</a>
    <a th:href="@{/diversao}">Diversão</a>
    <a th:href="@{/carrinho}" class="cart-link">
      Carrinho <span id="cart-count" class="cart-badge" aria-hidden="true"></span>
      <span class="sr-only" id="cart-count-sr"></span>
    </a>
  </nav>

  <div id="auth-status" class="auth-status" aria-live="polite"></div>
</header>

</body>
</html>
